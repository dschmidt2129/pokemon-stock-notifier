# pytest and coverage configuration.
# Running `python -m pytest tests/` automatically measures branch coverage across
# checker, backends, and config, and prints a missing-lines report after the test run.
# notifier.py is excluded because its tests only exercise config; adding notifier
# here would generate a "module-not-imported" warning with no useful data.
[tool:pytest]
addopts = --cov=checker --cov=backends --cov=config --cov-report=term-missing
asyncio_mode = auto

[coverage:run]
source =
    checker
    backends
    config
branch = true

[coverage:report]
show_missing = true
